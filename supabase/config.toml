# Rénovation : NE PAS SUPPRIMER.
# Sans ce fichier, `supabase functions deploy` remet verify_jwt = true par defaut
# et casse les webhooks appeles par des serveurs tiers (ils n'ont pas de JWT Supabase).
# C'est ce qui a mis paygreen-webhook hors service du 09/09/2026 au 11/09/2026.
project_id = "xbuftfwcyontgqbbrrjt"

[functions.paygreen-webhook]
verify_jwt = false

[functions.brevo-webhook]
verify_jwt = false

# 15/09/2026 : état constaté en prod (version 81) avant redéploiement — la fonction
# vérifie elle-même le jeton (service role ou JWT admin), ne pas la remettre en verify_jwt=true.
[functions.send-order-confirmation]
verify_jwt = false

# 02/10/2026 : état constaté en prod (supabase functions list) AVANT la branche
# fix/alertes-beyrouth, écrit noir sur blanc pour qu'un redéploiement ne change rien.
# Ces fonctions sont appelées avec un JWT valide (clé anon du site ou service_role du cron).
[functions.system-heartbeat]
verify_jwt = true

[functions.check-payment-status]
verify_jwt = true

[functions.monitor-pending-orders]
verify_jwt = true

[functions.create-payment]
verify_jwt = true

[functions.send-telegram-notification]
verify_jwt = true

# 25/11/2026 : état constaté en prod (supabase functions list, version 31) avant l'ajout
# de la durée de coupure. La fonction vérifie elle-même le JWT admin.
[functions.toggle-menu-item]
verify_jwt = false
