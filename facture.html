<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facture - A Beyrouth</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F7F4EE;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #FDFBF7;
      border-radius: 14px;
      border: 1px solid #E6DFD3;
      box-shadow: 0 1px 2px rgba(31,27,22,0.05);
      overflow: hidden;
    }
    .header {
      background: #FDFBF7;
      padding: 32px 32px 28px;
      text-align: center;
      color: #1F1B16;
      border-bottom: 1px dotted #B8AA98;
    }
    .header img {
      width: 180px;
      height: auto;
      margin-bottom: 16px;
    }
    .header h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 30px;
      font-weight: 400;
      margin: 0;
    }
    .download-section {
      padding: 24px 32px;
      text-align: center;
      background: #FDFBF7;
      border-bottom: 1px solid #E6DFD3;
    }
    .download-btn {
      background: #3E5A44;
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .download-btn:hover {
      opacity: 0.8;
    }
    .download-btn:active {
      opacity: 0.7;
    }
    #invoice-content {
      padding: 40px;
      display: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E6DFD3;
      border-top-color: #3E5A44;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error {
      background: #FDFBF7;
      border: 1px solid #C9A99C;
      border-radius: 8px;
      padding: 20px;
      margin: 20px;
      color: #714035;
      text-align: center;
    }
    @media (max-width: 768px) {
      body {
        padding: 0;
      }
      .container {
        border-radius: 0;
      }
      .header {
        padding: 20px;
      }
      .header img {
        width: 140px;
      }
      .header h1 {
        font-size: 20px;
      }
      .download-section {
        padding: 20px;
      }
      .download-btn {
        width: 100%;
        justify-content: center;
      }
      #invoice-content {
        padding: 20px !important;
      }
    }
    @media print {
      body {
        background: white;
        padding: 0;
      }
      .container {
        box-shadow: none;
        border-radius: 0;
      }
      .header, .download-section {
        display: none;
      }
      #invoice-content {
        display: block !important;
        padding: 0;
      }
    }
    /* Corrections audit 03/11 : logo de l'accueil, rien à imprimer quand le lien est invalide. */
    .header .facture-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
    .header .facture-logo img{width:auto;margin:0}
    .header .facture-olives{height:40px}
    .header .facture-texte{height:36px}
    @media (max-width: 768px){.header .facture-olives{height:32px}.header .facture-texte{height:29px}}
    .container:has(#error[style*="block"]) .download-section{display:none}
  </style>
</head>
<body>
  <div class="container">
    <div class="header" id="header">
      <div class="facture-logo"><img src="/img/logo-olives.svg" alt="" class="facture-olives"><img src="/img/logo-text-dark.svg" alt="Beyrouth Express" class="facture-texte"></div>
      <h1>Votre ticket</h1>
    </div>

    <div class="download-section" id="download-section">
      <button class="download-btn" onclick="window.print()">
        Télécharger / Imprimer en PDF
      </button>
      <p style="margin-top: 16px; color: #5E554A; font-size: 14px;">
        Utilisez « Enregistrer en PDF » dans la boîte de dialogue d'impression
      </p>
    </div>

    <div class="spinner" id="spinner"></div>
    <div id="error" class="error" style="display: none;"></div>
    <div id="invoice-content"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById('error').textContent = 'Lien invalide ou expiré';
      document.getElementById('error').style.display = 'block';
      document.getElementById('spinner').style.display = 'none';
    } else {
      // Charger la facture via token sécurisé.
      // Clé PUBLIQUE (anon, la même que index.html et confirmation.html) : la passerelle Supabase
      // exige un JWT (verify_jwt = true), sans elle chaque reçu répondait 401 (constaté le 16/10/2026).
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhidWZ0ZndjeW9udGdxYmJycmp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2Njg1NzksImV4cCI6MjA4NjI0NDU3OX0.ROkSccADlpLsWMgqyiX_xNaFdJNR8P4R-LJCnZV2Gzg';
      fetch(`https://xbuftfwcyontgqbbrrjt.supabase.co/functions/v1/generate-invoice-pdf?token=${encodeURIComponent(token)}`, {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
      })
        .then(response => {
          if (!response.ok) throw new Error(`Erreur ${response.status}`);
          return response.text();
        })
        .then(html => {
          // Extraire le contenu body ET les styles du head
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');

          // Injecter les styles de l'Edge Function dans le head
          doc.querySelectorAll('head style').forEach(style => {
            document.head.appendChild(document.adoptNode(style));
          });

          // Injecter le contenu via adoptNode (préserve le DOM parsé sans re-exécuter les scripts)
          const target = document.getElementById('invoice-content');
          target.innerHTML = '';
          Array.from(doc.body.childNodes).forEach(node => {
            target.appendChild(document.adoptNode(node));
          });
          document.getElementById('invoice-content').style.display = 'block';
          document.getElementById('spinner').style.display = 'none';
        })
        .catch(error => {
          // Message lisible pour le client, le détail technique reste dans la console.
          console.error('Reçu :', error.message);
          document.getElementById('error').textContent = 'Ce reçu est introuvable. Vérifiez le lien reçu par mail, ou écrivez-nous à contact@beyrouth.express et on vous le renvoie.';
          document.getElementById('error').style.display = 'block';
          document.getElementById('spinner').style.display = 'none';
        });
    }
  </script>
</body>
</html>
