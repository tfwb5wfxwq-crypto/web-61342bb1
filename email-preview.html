<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #fff; min-height: 100vh; }
h1 { font-size: 15px; font-weight: 600; padding: 14px 20px; background: #0a0a0a; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; }
h1 span { background: #D4A853; color: #000; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.grid { display: flex; gap: 16px; padding: 20px; overflow-x: auto; align-items: flex-start; }

.card { flex: 0 0 auto; cursor: pointer; }
.card-label { font-size: 12px; color: #888; margin-bottom: 8px; padding: 0 2px; }
.card-label strong { color: #fff; display: block; font-size: 13px; margin-bottom: 2px; }

/* Conteneur qui affiche l'iframe à moitié taille */
.frame-clip {
  width: 300px;
  height: 620px;
  overflow: hidden;
  border-radius: 8px;
  border: 1px solid #333;
  position: relative;
  transition: border-color .2s;
}
.card:hover .frame-clip { border-color: #D4A853; }

.frame-clip iframe {
  width: 600px;
  height: 1240px;
  border: none;
  transform: scale(0.5);
  transform-origin: top left;
  pointer-events: none;
  background: #fff;
}

/* Modal plein écran */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 999; align-items: center; justify-content: center; }
.modal.open { display: flex; }
.modal-inner { background: #fff; border-radius: 12px; overflow: hidden; width: 640px; max-height: 90vh; display: flex; flex-direction: column; }
.modal-bar { background: #111; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.modal-bar span { font-size: 13px; color: #aaa; }
.modal-bar button { background: #333; border: none; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.modal-bar button:hover { background: #444; }
.modal-scroll { overflow-y: auto; flex: 1; }
.modal-scroll iframe { width: 600px; height: 1300px; border: none; display: block; }
</style>

function openModal(e) {
  document.getElementById('modal-label').textContent = e.subject;
  document.getElementById('modal-frame').srcdoc = e.html;
  document.getElementById('modal').classList.add('open');
}
function closeModal(ev) {
  if (!ev || ev.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');

}
