<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f5;font-family:system-ui,sans-serif}
.bar{background:#fff;border-bottom:1px solid #eee;padding:10px 20px}
.info-address{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:#666}
.info-address svg{width:16px;height:16px;opacity:.5}
/* POPUP */
.loc-modal{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);backdrop-filter:blur(6px);padding:20px}
.loc-modal.open{display:flex;animation:locFadeIn .25s ease}
.loc-sheet{width:100%;max-width:440px;border-radius:22px;overflow:hidden;background:#0f0f0f;position:relative;box-shadow:0 24px 60px rgba(0,0,0,0.6);animation:locScaleIn .3s cubic-bezier(.22,1,.36,1)}
.loc-video-wrap{position:relative;width:100%;height:320px}
.loc-video{width:100%;height:100%;object-fit:cover;display:block}
.loc-video-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 45%,rgba(0,0,0,0.75) 100%)}
.loc-close{position:absolute;top:14px;right:14px;z-index:10;background:rgba(0,0,0,0.5);border:1.5px solid rgba(255,255,255,0.15);color:#fff;font-size:1rem;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;line-height:1}
.loc-body{padding:22px 24px 28px}
.loc-name{font-weight:700;font-size:1.1rem;color:#fff;margin:0 0 4px}
.loc-addr{font-size:.88rem;color:rgba(255,255,255,.65);margin:0 0 4px;line-height:1.5}
.loc-note{font-size:.8rem;color:rgba(255,255,255,.4);margin:0 0 18px}
.loc-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;background:#E65100;color:#fff;border-radius:11px;text-decoration:none;font-size:.88rem;font-weight:600;width:100%;justify-content:center}
@media(max-width:500px){.loc-modal{padding:0;align-items:flex-end}.loc-sheet{border-radius:24px 24px 0 0;max-width:100%}.loc-video-wrap{height:55vw;min-height:200px}}
@keyframes locFadeIn{from{opacity:0}to{opacity:1}}
@keyframes locScaleIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
</style></head>
<body>
<div class="bar">
  <a class="info-address" href="#" id="trigger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
    La Défense — Sortie 4 Métro
  </a>
</div>
<div class="loc-modal" id="locModal">
  <div class="loc-sheet" onclick="event.stopPropagation()">
    <div class="loc-video-wrap">
      <video class="loc-video" autoplay loop muted playsinline preload="auto">
        <source src="http://localhost:8765/beyrouth-location.mp4" type="video/mp4">
      </video>
      <div class="loc-video-overlay"></div>
      <button class="loc-close" id="locClose">✕</button>
    </div>
    <div class="loc-body">
      <p class="loc-name">A Beyrouth</p>
      <p class="loc-addr">4 Esplanade du Général de Gaulle<br>92400 Courbevoie (La Défense)</p>
      <p class="loc-note">Sortie 4 du métro La Défense</p>
      <a class="loc-btn" href="#">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Ouvrir dans Google Maps
      </a>
    </div>
  </div>
</div>
<script>
const modal=document.getElementById('locModal');
const closeBtn=document.getElementById('locClose');
function open(e){if(e)e.preventDefault();modal.classList.add('open');document.body.style.overflow='hidden';}
function close(){modal.classList.remove('open');document.body.style.overflow='';}
closeBtn.addEventListener('click',close);
modal.addEventListener('click',close);
document.getElementById('trigger').addEventListener('click',open);
// Auto-open pour screenshot
open();
</script>
</body></html>
