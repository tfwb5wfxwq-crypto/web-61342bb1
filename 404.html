<title>Page introuvable - A Beyrouth</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: #F7F4EE;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  img.logo {
    width: 80px;
    height: auto;
    margin-bottom: 32px;
  }
  main { width: min(520px, 100%); padding: 48px 32px; background: #FDFBF7; border: 1px solid #E6DFD3; border-radius: 14px; }
  h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 2.5rem;
    font-weight: 400;
    color: #1F1B16;
    margin-bottom: 16px;
  }
  p {
    font-size: 0.95rem;
    color: #5E554A;
    margin-bottom: 32px;
    line-height: 1.5;
  }
  .rule { width: 64px; border-top: 1px dotted #B8AA98; margin: 0 auto 24px; }
  a.btn {
    display: inline-block;
    background: #3E5A44;
    color: #fff;
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 9px;
    font-size: 0.95rem;
    font-weight: 500;
    border: 1px solid #3E5A44;
    transition: background .16s;
  }
  a.btn:hover { background: #304936; }
  a.btn:focus-visible { outline: 2px solid #3E5A44; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <img class="logo" src="/img/logo-olives.svg" alt="A Beyrouth" onerror="this.style.display='none'">
    <div class="rule"></div>
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou a été déplacée.<br>Retournez au menu pour passer commande.</p>
    <a class="btn" href="/">Voir le menu</a>
  </main>
</body>
</html>
