name: Menu de secours à jour

# Toutes les 30 min : recopie le menu (prix, articles) de Supabase dans le
# menu de secours de index.html. Commit seulement s'il y a un changement.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: menu-fallback
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Régénérer le menu de secours
        run: python3 scripts/gen-menu-fallback.py
      - name: Commit si changement
        run: |
          if git diff --quiet -- index.html; then echo "Rien à faire"; exit 0; fi
          git config user.name "menu-fallback-bot"
          git config user.email "menu-fallback-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Menu de secours : synchro automatique avec la base"
          git pull --rebase
          git push
